name: Alps test results
run-name: >-
  Alps ${{ inputs.suite }}
  · ${{ inputs.tested_sha }}

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        required: true
        type: choice
        options:
          - unit
          - functional
      tested_sha:
        description: Full commit SHA from the test run
        required: true
        type: string
      report:
        description: Compact JSON report from tests/publish_results.sh
        required: true
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize Alps results and publish commit status
        id: summary
        uses: actions/github-script@v8
        env:
          ALPS_REPORT: ${{ inputs.report }}
          ALPS_SUITE: ${{ inputs.suite }}
          ALPS_TESTED_SHA: ${{ inputs.tested_sha }}
          POLICY_SHA: ${{ github.workflow_sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const suite = process.env.ALPS_SUITE;
            const testedSha = process.env.ALPS_TESTED_SHA;

            if (
              !['unit', 'functional'].includes(suite) ||
              !/^[a-f0-9]{40}$/i.test(testedSha)
            ) {
              throw new Error('Invalid suite or tested commit');
            }

            const target = [
              context.serverUrl,
              context.repo.owner,
              context.repo.repo,
              'actions/runs',
              context.runId,
            ].join('/');
            const stableContext = `alps/${suite}/regressions`;
            const status = (state, description, name = stableContext) => {
              return github.rest.repos.createCommitStatus({
                ...context.repo,
                sha: testedSha,
                state,
                description,
                context: name,
                target_url: target,
              });
            };

            try {
              await status('pending', 'Checking regressions and coverage.');
              const report = JSON.parse(process.env.ALPS_REPORT);

              if (
                report.suite !== suite ||
                report.sha !== testedSha ||
                report.version !== 2 ||
                report.policy_sha !== process.env.POLICY_SHA ||
                !Array.isArray(report.selections) ||
                !report.selections.length ||
                report.selections.length > 256
              ) {
                throw new Error('Invalid report or stale policy revision');
              }

              const trustedFile = async file => {
                const {data} = await github.rest.repos.getContent({
                  ...context.repo,
                  path: file,
                  ref: process.env.POLICY_SHA,
                });
                return Buffer.from(data.content, 'base64').toString('utf8');
              };
              const policyFile = 'tests/test_utils/recipes/gh200/known-failures.json';
              const moduleFile = '.github/workflows/alps-regression-policy.cjs';
              const policy = JSON.parse(await trustedFile(policyFile));
              const modulePath = path.resolve('alps-regression-policy.cjs');

              fs.writeFileSync(modulePath, await trustedFile(moduleFile));
              const {evaluateReport, renderReport} = require(modulePath);
              const gate = evaluateReport(report, policy);
              const markdown = renderReport(report, gate);

              for (const test of gate.unexpected.slice(0, 20)) {
                const detail = test.errors.join('; ').slice(0, 500);
                core.error(`${test.test_id}: ${detail}`, {
                  title: 'New or changed test failure',
                });
              }

              const artifact = {...report, regression_gate: gate};
              fs.writeFileSync('alps-results.json', JSON.stringify(artifact, null, 2));
              fs.writeFileSync('alps-results.md', markdown);
              await core.summary.addRaw(markdown).write();
              core.setOutput('state', gate.state);

              const counts = [
                `${gate.unexpected.length} new`,
                `${gate.known.length} known`,
                `${gate.fixed.length} fixed`,
              ].join(', ');
              const coverage = gate.incomplete.length ? '; coverage incomplete.' : '.';
              const description = counts + coverage;

              await status(gate.state, description);
              await status(gate.state, description, `alps/${suite}/${context.runId}`);
            } catch (error) {
              await status('error', 'Report could not be validated.');
              throw error;
            }

      - name: Save report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alps-test-report
          path: |
            alps-results.json
            alps-results.md
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce regression gate
        if: steps.summary.outputs.state != 'success'
        run: |
          echo 'New failures or incomplete test coverage.'
          exit 1
